name: Coletar preços e publicar
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # O script controla 48h reais e as datas especiais; o cron apenas verifica.
    - cron: '17 10 * * *'
concurrency:
  group: radar-precos-publicacao
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testar proteções
        run: python -m unittest discover -s tests -v
      - name: Coletar quando agendado ou solicitado
        if: github.event_name != 'push'
        id: collection
        continue-on-error: true
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python update_prices.py
      - name: Preservar histórico e estado
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/prices.json
          if ! git diff --cached --quiet; then
            git commit -m 'Atualizar histórico e estado da coleta'
            git push
          fi
      - name: Preparar somente arquivos públicos
        run: |
          mkdir -p public/data
          cp index.html products.json store-policy.js public/
          cp data/prices.json public/data/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Informar coleta interrompida
        if: steps.collection.outcome == 'failure'
        run: echo 'Coleta interrompida por segurança. Consulte collection_status em data/prices.json.' >> "$GITHUB_STEP_SUMMARY"
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
